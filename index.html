V.qz=()=>{if(qi>=QZ.length){const p=Math.round(sc/QZ.length*100);return`<div class="card"><h2>Your score: ${sc}/${QZ.length} (${p}%)</h2><p>${p>=80?'Excellent work! 🏆':p>=50?'Good effort. Keep practising.':'Review the lessons and try again.'}</p><button onclick="qi=0;sc=0;qa=-1;show('qz')">Try again</button></div>`}const q=QZ[qi];return`<div class="card"><small>Question ${qi+1} of ${QZ.length} · Score ${sc}</small><h3>${q[0]}</h3>${q[1].map((o,i)=>`<button class="opt ${qa<0?'':i==q[2]?'good':i==qa?'bad':''}" onclick="ans(${i})">${'ABCD'[i]}. ${o}</button>`).join('')}${qa<0?'':`<p>${qa==q[2]?'✅ Correct! ':'❌ Not quite. '}${q[3]}</p><button onclick="nxt()">${qi==QZ.length-1?'See score':'Next →'}</button>`}</div>`};
V.pr=()=>`<select onchange="pf=+this.value;show('pr')" aria-label="Chapter"><option value="-1">All chapters</option>${LS.map((l,i)=>`<option value="${i}" ${pf==i?'selected':''}>${l.t}</option>`).join('')}</select><div class="card" style="margin-top:12px">${PR.filter(p=>pf<0||p[0]==pf).map(p=>`<details><summary>${p[1]}</summary><p>${p[2]}</p></details>`).join('')}</div>`;
V.pg=()=>{const d=P().done.length,p=Math.round(d/LS.length*70+P().best*.3),b=[['📘 First lesson',d>=1],['📚 All lessons',d==LS.length],['🏆 Quiz master (80%+)',P().best>=80],...(SUB=='chem'?[['🔭 Element explorer (10 elements)',P().seen.length>=10]]:[])];return`<div class="card"><h2>Progress: ${p}%</h2><div class="bar"><i style="width:${p}%"></i></div><p>Lessons completed: ${d}/${LS.length} · Best quiz score: ${P().best}%</p></div><h3>Achievements</h3><div class="grid">${b.map(x=>`<div class="card ${x[1]?'ok':'lock'}">${x[0]}${x[1]?' ✓':' 🔒'}</div>`).join('')}</div><button onclick="delete S[SUB];save();show('pg')">Reset progress</button>`};
$('#q').oninput=e=>{const v=e.target.value.trim().toLowerCase();if(!v)return show(S.tab);const el=(SUB=='chem'?E:[]).filter(x=>x.name.toLowerCase().includes(v)||x.s.toLowerCase()==v).slice(0,12),l=LS.map((l,i)=>[l,i]).filter(([l])=>(l.t+l.n+l.d).toLowerCase().includes(v));$('#m').innerHTML=`<h3>Results for “${e.target.value}”</h3><div class="grid">${el.map(x=>`<button class="card" onclick="info(${x.n})"><small>Element ${x.n}</small><h3>${x.s} · ${x.name}</h3></button>`).join('')}${l.map(([l,i])=>`<button class="card" onclick="openL(${i})"><small>${l.c}</small><h3>${l.t}</h3></button>`).join('')}</div>${el.length+l.length?'':'<p class="mu">Nothing found. Try an element name or a topic like “acid”.</p>'}`};
home();
</script></body></html>
